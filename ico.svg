<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c72c4"/>
      <stop offset="1" stop-color="#0f2a4a"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="256" height="256" rx="52" ry="52" fill="url(#bg)"/>

  <!-- 填方区域（设计线与地面线之间） -->
  <path d="M 28 150 L 58 150 L 88 128 L 168 128 L 198 150 L 228 150
           L 228 210 L 28 210 Z"
        fill="#7bc0e8" opacity="0.28"/>

  <!-- 地面线（波浪） -->
  <path d="M 28 195 Q 58 175, 88 192 T 148 188 Q 178 175, 228 195"
        stroke="#7bc0e8" stroke-width="6" fill="none"
        stroke-linecap="round"/>

  <!-- 设计线 / 路基顶面 -->
  <path d="M 28 150 L 58 150 L 88 128 L 168 128 L 198 150 L 228 150"
        stroke="#ffffff" stroke-width="9" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 中桩虚线 -->
  <line x1="128" y1="128" x2="128" y2="212"
        stroke="#ffffff" stroke-width="4"
        stroke-dasharray="9,7" opacity="0.85"/>

  <!-- 中桩顶小圆点 -->
  <circle cx="128" cy="128" r="7" fill="#ffcb3d"/>
</svg>